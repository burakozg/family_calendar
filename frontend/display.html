<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Family Calendar — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ACeP 6-colour e-ink palette (matches _inkyframe/calendar_draw.py) */
:root {
  --black:#000000; --white:#ffffff; --red:#ff0000; --green:#00ff00; --blue:#0000ff; --yellow:#ffff00;
  --page:#d8d8d0;             /* muted grey so the white "panel" reads like e-ink */
  --grid:#000000;
  --shade:#555555;            /* dark grey for off-month hatch + past-day dots (preview only) */
  /* device screen is 800x480 */
  --sw:800px; --sh:480px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background:var(--page); color:var(--black);
  font-family:'Silkscreen','DejaVu Sans Mono','Courier New',monospace;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; overflow:hidden; gap:0;
}
/* The device: screen panel + button legend, scaled together to fit the viewport */
#device { display:flex; flex-direction:column; }
#screen {
  width:var(--sw); height:var(--sh); background:var(--white);
  position:relative; overflow:hidden; border:2px solid var(--black);
}
/* Buttons row beneath the screen, like the physical A–E buttons */
#buttons { width:var(--sw); display:flex; background:#111; border:2px solid var(--black); border-top:none; }
.btn { flex:1; text-align:center; padding:9px 4px; font-size:9px; color:#fff; background:none;
  border:none; border-left:1px solid #333; cursor:pointer; font-family:inherit; letter-spacing:.5px;
  text-transform:uppercase; line-height:1.4; }
.btn:first-child { border-left:none; }
.btn .k { display:block; font-size:11px; color:#888; }
.btn.active { background:#fff; color:#000; }
.btn.active .k { color:#000; }

/* Live dot (top-right of screen) */
#dot { position:absolute; top:5px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--green);
  animation:blink 2s ease-in-out infinite; z-index:5; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
#dot.off { background:var(--red); animation:none; }

/* ── Calendar screen ─────────────────────────────────────────── */
.cal { position:absolute; inset:0; padding:4px; display:flex; flex-direction:column; }
.cal-head { display:flex; align-items:flex-start; justify-content:space-between; height:34px; }
.title { font-size:22px; font-weight:700; letter-spacing:1px; }
.legend { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; max-width:520px; }
.leg { display:inline-flex; align-items:center; height:16px; padding:0 5px; font-size:10px; }
.weekdays { display:grid; grid-template-columns:repeat(7,1fr); }
.weekday { font-size:11px; font-weight:700; padding:0 4px 2px; }
.grid { flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; }
/* dotted borders — every cell paints its top+left; grid paints right+bottom edges */
.cell { position:relative; background:var(--white); padding:1px 2px;
  border-top:1px dotted var(--black); border-left:1px dotted var(--black);
  overflow:hidden; display:flex; flex-direction:column; }
.grid .cell:nth-child(7n) { box-shadow:1px 0 0 0 transparent; }
.grid { border-right:1px dotted var(--black); border-bottom:1px dotted var(--black); }
.cell.off { background-image:repeating-linear-gradient(45deg,var(--shade) 0 .5px,transparent .5px 3px); }
.cell.past { background-image:radial-gradient(var(--shade) 0.4px, transparent 0.5px); background-size:3px 3px; }
.cell.today { outline:3px solid var(--red); outline-offset:-3px; z-index:2; }
.cell-top { display:flex; align-items:flex-start; justify-content:space-between; gap:2px; }
.daynum { font-size:14px; font-weight:700; line-height:1; }
.cell.off .daynum, .cell.past .daynum { background:var(--white); padding:0 1px; }
.icons { display:flex; gap:1px; flex-shrink:0; }
.ic { width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center; }
.ic svg { width:11px; height:11px; }
.evs { margin-top:2px; display:flex; flex-direction:column; gap:1px; overflow:hidden; }
.ev { font-size:10px; line-height:13px; height:13px; padding:0 2px; white-space:nowrap; overflow:hidden;
  text-overflow:clip; font-weight:700; }
.ev.dim { background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 1px,transparent 1px 2px); }
.more { font-size:9px; font-weight:700; }

/* ── Meals screen ────────────────────────────────────────────── */
.meals { position:absolute; inset:0; display:flex; }
.mweek { width:180px; border-right:2px solid var(--black); display:flex; flex-direction:column; }
.mrow { flex:1; border-bottom:1px solid var(--black); padding:4px 6px; position:relative; overflow:hidden; }
.mrow:last-child { border-bottom:none; }
.mrow.past { background-image:radial-gradient(var(--shade) 0.4px, transparent 0.5px); background-size:3px 3px; }
.mrow.sel { outline:3px solid var(--red); outline-offset:-3px; }
.mrow .d { font-size:11px; font-weight:700; }
.mrow.sel .d { color:var(--red); }
.mrow .n { font-size:13px; font-weight:700; margin-top:2px; line-height:1.15; }
.mrow.past .d, .mrow.past .n { background:rgba(255,255,255,.55); }
.recipe { flex:1; padding:8px 10px; overflow:hidden; display:flex; flex-direction:column; }
.r-title { font-size:22px; font-weight:700; line-height:1.1; }
.r-meta { background:var(--black); color:var(--white); font-size:12px; padding:4px 6px; margin:8px 0; align-self:flex-start; }
.r-h { color:var(--red); font-size:13px; font-weight:700; margin:6px 0 3px; }
.r-cols { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
.r-ing { font-size:11px; line-height:1.45; }
.r-steps { font-size:11px; line-height:1.45; }
.r-step { margin-bottom:2px; }
.r-empty { font-size:18px; font-weight:700; margin-top:6px; }
.r-trunc { color:var(--red); font-size:10px; margin-top:4px; }
</style>
</head>
<body>

<div id="device">
  <div id="screen">
    <div id="dot" title="Live"></div>
    <div id="view"></div>
  </div>
  <div id="buttons">
    <button class="btn" data-btn="a"><span class="k">A</span>Last Month</button>
    <button class="btn active" data-btn="b"><span class="k">B</span>Home</button>
    <button class="btn" data-btn="c"><span class="k">C</span>Next Month</button>
    <button class="btn" data-btn="d"><span class="k">D</span>Today's Recipe</button>
    <button class="btn" data-btn="e"><span class="k">E</span>Tomorrow's Recipe</button>
  </div>
</div>

<script>
const API = window.location.origin;
const NS = 'http://www.w3.org/2000/svg';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// screen: 'calendar' | 'today' | 'tomorrow'    monthOffset: -1 | 0 | 1
let screen = 'calendar', monthOffset = 0, data = {};

// ── SVG icons (shared with the mobile/admin UIs) ──────────────
function mkSvg(paths){ const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('fill','none');
  paths.forEach(([d,a])=>{ const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); Object.entries(a||{}).forEach(([k,v])=>p.setAttribute(k,v)); s.appendChild(p); }); return s; }
const st=(d,w)=>[d,{stroke:'currentColor','stroke-width':w||'1.4','stroke-linecap':'round','stroke-linejoin':'round'}];
const fi=d=>[d,{fill:'currentColor'}];
const ICONS = {
  trash:()=>mkSvg([fi('M5 3h6l.5 1.5H4.5L5 3zm-1.5 2h9l-.7 7H5.2L3.5 5zm3 2v4h1V7h-1zm2 0v4h1V7h-1z')]),
  cake:()=>mkSvg([fi('M8 2c.4 0 .7.3.7.7V4H11a1 1 0 011 1v1.5H4V5a1 1 0 011-1h2.3V2.7C7.3 2.3 7.6 2 8 2zM3 8h10v1c0 .5-.6 1.2-1.8.8-.8-.3-1.3-.8-1.7-.8s-.9.5-1.7.8S6.4 9.5 5.8 9.8C4.6 10.2 4 9.5 4 9L3 8zm0 3.5h10V14H3v-2.5z')]),
  football:()=>mkSvg([fi('M8 2a6 6 0 100 12A6 6 0 008 2zm0 1.5L10 5l-.8 2.5H6.8L6 5l2-1.5zm-3 5l1-1.5h4l1 1.5L8 12 5 8.5z')]),
  swim:()=>mkSvg([st('M2 10c1.2 0 2-1 3-1s1.8 1 3 1 2-1 3-1 1.8 1 3 1'),st('M2 13c1.2 0 2-1 3-1s1.8 1 3 1 2-1 3-1 1.8 1 3 1'),st('M8 7V5'),st('M6.5 4a1.5 1.5 0 103 0 1.5 1.5 0 00-3 0')]),
  gym:()=>mkSvg([st('M2 8h2M12 8h2M4 8h8M4 6.5v3M12 6.5v3M6 5.5v5M10 5.5v5','1.5')]),
  meeting:()=>mkSvg([st('M4 4h8a1 1 0 011 1v5a1 1 0 01-1 1H9l-2 2-2-2H4a1 1 0 01-1-1V5a1 1 0 011-1z','1.3')]),
  doctor:()=>mkSvg([st('M8 2a3 3 0 100 6 3 3 0 000-6zM3 13c0-2.8 2.2-4.5 5-4.5S13 10.2 13 13','1.3'),st('M10 12h3M11.5 10.5v3','1.2')]),
  school:()=>mkSvg([st('M8 2l6 3-6 3-6-3 6-3zm-4 5v4c0 1 1.8 2 4 2s4-1 4-2V7','1.3')]),
  yoga:()=>mkSvg([st('M8 3a1.2 1.2 0 100 2.4A1.2 1.2 0 008 3zM5 7.5C5 6.7 6.3 6 8 6s3 .7 3 1.5M5.5 9.5L4 12M10.5 9.5L12 12M6 10h4','1.3')]),
  travel:()=>mkSvg([st('M3 13l10-10M8 3h5v5','1.4')]),
  bbq:()=>mkSvg([st('M3 6h10M5 6V4.5M8 6V4M11 6V4.5M6.5 9c0 2 .7 3.5 1.5 3.5S9.5 11 9.5 9M7.5 13h3','1.3')]),
  date:()=>mkSvg([fi('M8 2C5.2 2 3 4.2 3 7c0 3.5 5 8 5 8s5-4.5 5-8c0-2.8-2.2-5-5-5zm0 6.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z')]),
  star:()=>mkSvg([fi('M8 2l1.5 3.5L13 6l-2.5 2.5.6 3.5L8 10.5 4.9 12l.6-3.5L3 6l3.5-.5z')]),
  music:()=>mkSvg([st('M6 12V4l7-1.5v8','1.3'),st('M4.5 14a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM11.5 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3z','1.2')]),
  run:()=>mkSvg([fi('M9 3a1 1 0 100 2 1 1 0 000-2z'),st('M6 5.5l-2 5M6 5.5l3 1 2-2.5','1.3'),st('M4 10.5l2 3M9 6.5l1 4-3 2','1.3')]),
  beachvolley:()=>mkSvg([st('M8 2a6 6 0 100 12A6 6 0 008 2z','1.3'),st('M4 5c1.3.8 2.3 2 2.5 3.5S5.8 11 5 12','1.2'),st('M12 5c-1.3.8-2.3 2-2.5 3.5S9.2 11 10 12','1.2'),st('M2.5 8.5h11','1.2')]),
  pizza:()=>mkSvg([st('M8 2L3 13h10L8 2z','1.3'),st('M5 10h6','1.2'),fi('M8 5.5a1 1 0 100 2 1 1 0 000-2')]),
  beer:()=>mkSvg([st('M4 5h7v8a1 1 0 01-1 1H5a1 1 0 01-1-1V5z','1.3'),st('M11 7.5h1.5a1 1 0 010 3H11','1.3'),st('M4 8h7','1.2')]),
  whisky:()=>mkSvg([st('M4.5 3h7l-.8 10H5.3L4.5 3z','1.3'),st('M5 7h6','1.2')]),
  coffee:()=>mkSvg([st('M3 7h9v4a3 3 0 01-3 3H6a3 3 0 01-3-3V7z','1.3'),st('M12 8h1a1.5 1.5 0 010 3h-1','1.3'),st('M5.5 5c0-1 1-1.5 1-2.5','1.2'),st('M8.5 5c0-1 1-1.5 1-2.5','1.2')]),
  cocktail:()=>mkSvg([st('M3 3h10L8 9v5','1.3'),st('M6 14h4','1.3')]),
  car:()=>mkSvg([st('M3 10l1.5-3.5a1 1 0 01.9-.5h5.2a1 1 0 01.9.5L13 10v3H3v-3z','1.3'),st('M3 10h10','1.2'),fi('M5 12.5a1 1 0 100-2 1 1 0 000 2z'),fi('M11 12.5a1 1 0 100-2 1 1 0 000 2z')]),
  broom:()=>mkSvg([st('M13 3L7 9','1.4'),st('M7 9L4 13.5','1.3'),st('M7 9L10 13.5','1.3'),st('M4 13.5L10 13.5','1.3'),st('M7 9.5V13.5','1'),st('M5.5 11.5L5 13.5','1'),st('M8.5 11.5L9 13.5','1')]),
};
function iconSvg(key){ return (ICONS[key]||ICONS.star)(); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── Fit the 800x480 device into the viewport ──────────────────
function fit(){
  const dev = document.getElementById('device');
  const pad = 16;
  const scale = Math.min((window.innerWidth - pad) / 800, (window.innerHeight - pad) / 524); // 480 screen + ~44 buttons
  // Use `zoom` (paints at the final resolution) instead of `transform: scale`
  // (rasterizes at 800px then GPU-downsamples the layer). Downsampling the fine
  // 1px/4px diagonal off-month hatch aliased it into thick, uneven grey smears
  // on smaller screens; zoom keeps the pinstripes thin and even.
  dev.style.zoom = String(scale);
  dev.style.transform = '';
  dev.style.transformOrigin = '';
}
window.addEventListener('resize', fit);

// ── Render dispatch ───────────────────────────────────────────
function render(){
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = screen==='today' ? 'd' : screen==='tomorrow' ? 'e' : ({'-1':'a','0':'b','1':'c'}[String(monthOffset)]||'b');
  const el = document.querySelector(`.btn[data-btn="${activeBtn}"]`); if (el) el.classList.add('active');
  document.getElementById('view').innerHTML =
    (screen==='calendar') ? renderCalendar() : renderMeals(screen);
  fit();
}

function todayParts(){ const t=(data.today||'').split('-').map(Number); return {y:t[0],m:t[1],d:t[2]}; }

function renderCalendar(){
  const cells = data.cells || [];
  const legend = data.legend || [];
  const T = todayParts();
  const title = `${(data.month_name||'')} ${data.year||''}`;

  // Birthday/holiday legend chips mirror the cells' colors directly from
  // event_colors, so the legend always matches even if the cached legend field is stale.
  const ec = data.event_colors || {};
  let leg = legend.map(l => {
    let bg = l.color, fg = l.text_color;
    if (l.label === 'Birthday') { bg = ec.birthday || bg; fg = ec.birthdayText || fg; }
    else if (l.label === 'Holiday') { bg = ec.holiday || bg; fg = ec.holidayText || fg; }
    return `<span class="leg" style="background:${esc(bg)};color:${esc(fg)}">${esc(l.label)}</span>`;
  }).join('');

  let wk = DAYS.map(d=>`<div class="weekday">${d}</div>`).join('');

  let grid = cells.map(cell => {
    const inMonth = cell.current_month !== false;
    const isToday = !!cell.today;
    const isPast  = inMonth && !isToday && (cell.day||0) < T.d && (data.month===T.m);
    const evs = cell.events || [];
    const iconOnly = evs.filter(e=>e.icon_only);
    const textEvs  = evs.filter(e=>!e.icon_only);
    let cls = 'cell' + (inMonth?'':' off') + (isPast?' past':'') + (isToday?' today':'');

    let icons = iconOnly.map(e =>
      `<span class="ic" style="color:${esc(e.bg||'#000')}" title="${esc(e.label)}">${iconSvg(e.icon).outerHTML}</span>`).join('');

    const MAX = 4;
    let evhtml = textEvs.slice(0,MAX).map(e => {
      let bg, fg;
      if (e.type==='birthday'){ bg = data.event_colors?.birthday||'#ffff00'; fg = data.event_colors?.birthdayText||'#000'; }
      else if (e.type==='holiday'){ bg = data.event_colors?.holiday||'#ff0000'; fg = data.event_colors?.holidayText||'#fff'; }
      else { bg = e.bg||'#000'; fg = e.text_color||'#fff'; }
      return `<div class="ev${isPast?' dim':''}" style="background:${esc(bg)};color:${esc(fg)}" title="${esc(e.label)}">${esc(e.label)}</div>`;
    }).join('');
    if (textEvs.length>MAX) evhtml += `<div class="more">+${textEvs.length-MAX}</div>`;

    const daynumStyle = cell.holiday ? ' style="color:var(--red)"' : '';
    return `<div class="${cls}">
      <div class="cell-top"><span class="daynum"${daynumStyle}>${cell.day||''}</span><span class="icons">${icons}</span></div>
      <div class="evs">${evhtml}</div>
    </div>`;
  }).join('');

  return `<div class="cal">
    <div class="cal-head"><div class="title">${esc(title)}</div><div class="legend">${leg}</div></div>
    <div class="weekdays">${wk}</div>
    <div class="grid">${grid}</div>
  </div>`;
}

function renderMeals(which){
  const T = todayParts();
  // today's weekday index (Mon=0)
  let todayDow = -1;
  if (data.today){ const dt=new Date(data.today+'T00:00'); todayDow = (dt.getDay()+6)%7; }

  let weekPlan, selDow, pastCut, meal, prefix;
  if (which==='tomorrow'){
    meal = data.tomorrow_meal; prefix='(Tomorrow) ';
    if (todayDow===6){ weekPlan = data.meal_plan_next||[]; selDow=0; pastCut=0; }
    else { weekPlan = data.meal_plan||[]; selDow=todayDow+1; pastCut=todayDow; }
  } else {
    meal = data.today_meal; prefix='';
    weekPlan = data.meal_plan||[]; selDow=todayDow; pastCut=todayDow;
  }

  let rows = '';
  for (let i=0;i<7;i++){
    const m = weekPlan[i] && typeof weekPlan[i]==='object' ? weekPlan[i] : {};
    const name = m.name || '-';
    const cls = 'mrow' + (i===selDow?' sel':'') + (i<pastCut?' past':'');
    rows += `<div class="${cls}"><div class="d">${DAYS[i]}</div><div class="n">${esc(name)}</div></div>`;
  }

  return `<div class="meals">
    <div class="mweek">${rows}</div>
    <div class="recipe">${renderRecipe(meal, prefix)}</div>
  </div>`;
}

function renderRecipe(tm, prefix){
  if (!tm) return `<div class="r-empty">${esc(prefix)}No dinner planned</div>`;
  const meta = [];
  if (tm.cuisine) meta.push(tm.cuisine);   // the whole meta line is esc()'d on join
  const tot = (tm.prep_time_min||0)+(tm.cook_time_min||0);
  if (tot) meta.push(`${tot} min`);
  if (tm.difficulty) meta.push(`difficulty ${tm.difficulty}/5`);
  if (tm.servings) meta.push(`serves ${tm.servings}`);

  let html = `<div class="r-title">${esc(prefix)}${esc(tm.name||'')}</div>`;
  if (meta.length) html += `<div class="r-meta">${esc(meta.join('  |  '))}</div>`;

  const ings = tm.ingredients||[], steps = tm.steps||[];
  if (!ings.length && !steps.length){
    if (tm.notes) html += `<div class="r-ing">${esc(tm.notes)}</div>`;
    return html;
  }
  if (ings.length){
    const mid = Math.ceil(ings.length/2);
    const col = arr => arr.map(g=>`<div class="r-ing">- ${esc(g)}</div>`).join('');
    html += `<div class="r-h">INGREDIENTS</div><div class="r-cols"><div>${col(ings.slice(0,mid))}</div><div>${col(ings.slice(mid))}</div></div>`;
  }
  if (steps.length){
    html += `<div class="r-h">METHOD</div><div class="r-steps">` +
      steps.map((s,i)=>`<div class="r-step">${i+1}. ${esc(s)}</div>`).join('') + `</div>`;
  }
  return html;
}

// ── Navigation ────────────────────────────────────────────────
function go(btn){
  if (btn==='a'){ screen='calendar'; monthOffset=-1; }
  else if (btn==='b'){ screen='calendar'; monthOffset=0; }
  else if (btn==='c'){ screen='calendar'; monthOffset=1; }
  else if (btn==='d'){ screen='today'; monthOffset=0; }
  else if (btn==='e'){ screen='tomorrow'; monthOffset=0; }
  else return;
  loadData();
}
document.getElementById('buttons').addEventListener('click', e=>{
  const b = e.target.closest('.btn'); if (b) go(b.dataset.btn);
});
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if ('abcde'.includes(k)) go(k);
  else if (e.key==='ArrowLeft') go('a');
  else if (e.key==='ArrowRight') go('c');
  else if (e.key==='Home') go('b');
});

// ── Data + live updates ───────────────────────────────────────
async function loadData(){
  try {
    const r = await fetch(`${API}/display-data?month_offset=${monthOffset}`);
    data = await r.json();
    document.getElementById('page-title').textContent = (data.app_name || 'Family Calendar') + ' — Display';
    document.getElementById('dot').classList.remove('off');
    render();
  } catch(e){
    document.getElementById('dot').classList.add('off');
  }
}
function connect(){
  const es = new EventSource(`${API}/stream`);
  es.addEventListener('update', ()=>loadData());
  es.onerror = ()=>{ document.getElementById('dot').classList.add('off'); setTimeout(connect,5000); };
  es.addEventListener('connected', ()=>document.getElementById('dot').classList.remove('off'));
}

loadData().then(connect);
</script>
</body>
</html>
