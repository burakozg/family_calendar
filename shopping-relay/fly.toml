# Fly.io deployment for the shopping relay.
# Set tokens as secrets (not here):
#   fly secrets set PUBLISH_TOKEN=$(openssl rand -hex 32) \
#                   DEVICE_TOKEN=$(openssl rand -hex 32) \
#                   DEVICE_WRITE_TOKEN=$(openssl rand -hex 32)
# DEVICE_WRITE_TOKEN is the separate scope required to add calendar entries;
# omit it to run in single-token mode (device token can then also write).
app = "family-shopping-relay"        # change to a unique name: fly apps create <name>
primary_region = "arn"                # Stockholm; pick your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_DATA = "/data/relay.json"

[[mounts]]
  source = "relay_data"               # persistent volume: fly volumes create relay_data --size 1
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
