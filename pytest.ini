[pytest]
# `backend/` is where the suite lives; naming it here means `pytest` works from
# the repo root as well as through ./run-tests.sh, which cd's into backend.
testpaths = backend/tests

# A hang must fail, not wait. This suite used to wedge intermittently in
# TestClient teardown — the app's startup launched background loops that nothing
# cancelled — and an unbounded hang is invisible: no traceback, no failing test
# name, just a process that never returns. It made the suite unusable as a gate
# and wedged anything running it unattended.
#
# 30s is far above the whole suite's ~2.5s, so this only ever fires on a real
# hang, and when it does it points at the test.
timeout = 30
